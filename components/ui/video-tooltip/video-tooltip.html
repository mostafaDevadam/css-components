        // Format seconds into MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Unified function to update position and time text
        function updateTooltip(percentage, timeText) {
            tooltip.textContent = timeText;
            // Centers the tooltip by accounting for the track percentage and thumb offset
            tooltip.style.left = `calc(${percentage}% + (${8 - (percentage * 0.16)}px))`;
        }

        // Update video and tooltip when sliding
        range.addEventListener('input', () => {
            if (!video.duration) return;
            const percentage = Number(range.value);
            const time = (percentage / 100) * video.duration;

            video.currentTime = time;
            tooltip.style.visibility = 'visible';
            updateTooltip(percentage, formatTime(time));
        });

        // Show/Hide on hover
        range.addEventListener('mouseenter', () => {
            tooltip.style.visibility = 'visible';
            if (video.duration) {
                const percentage = (video.currentTime / video.duration) * 100;
                updateTooltip(percentage, formatTime(video.currentTime));
            }
        });

        range.addEventListener('mouseleave', () => {
            tooltip.style.visibility = 'hidden';
        });

        // Update range bar and tooltip as video plays naturally
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const percentage = (video.currentTime / video.duration) * 100;
            range.value = percentage;

            // Only update position automatically if mouse isn't interacting/hovering
            updateTooltip(percentage, formatTime(video.currentTime));
        });

        // Play/Pause toggle
        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.textContent = 'Pause';
                container.classList.add('playing');
            } else {
                video.pause();
                playBtn.textContent = 'Play';
                container.classList.remove('playing');
            }
        });



    </script>
